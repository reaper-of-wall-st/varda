[workspace]
members = ["varda-core", "varda-daemon", "varda-node", "varda-tui"]
resolver = "2"

[workspace.dependencies]
anyhow = { path = "libs/anyhow", version = "1.0.104" }
bollard = { path = "libs/bollard", version = "0.21.1", features = ["ssl"] }
bollard-stubs = { path = "libs/bollard/codegen/swagger", version = "1.53.1-rc.29.3.1" }
chrono = { path = "libs/chrono", version = "0.4.45", features = ["serde"] }
clap = { path = "libs/clap", version = "4.6.6", features = ["derive"] }
comfy-table = { path = "libs/comfy-table", version = "8.0.0", features = ["tty"] }
crossterm = { path = "libs/crossterm", version = "0.29.0", features = ["bracketed-paste","events","windows","derive-more"] }
indoc = { path = "libs/indoc", version = "2.0.7" }
owo-colors = { path = "libs/owo-colors", version = "4.3.0" }
rand = { path = "libs/rand", version = "0.10.2" }
ratatui = { path = "libs/ratatui/ratatui", version = "0.30.2", features = ["all-widgets","crossterm","layout-cache","macros","underline-color"] }
rig = { path = "libs/rig", version = "0.41.0" }
rig-agent = { path = "libs/rig/crates/rig-agent", version = "0.41.0" }
rig-core = { path = "libs/rig/crates/rig-core", version = "0.41.0", features = ["reqwest","derive","rustls"] }
rig-derive = { path = "libs/rig/crates/rig-derive", version = "0.41.0" }
rmp = { path = "libs/msgpack-rust/rmp", version = "0.8.15", features = ["std"] }
rmp-serde = { path = "libs/msgpack-rust/rmp-serde", version = "1.3.1" }
serde = { path = "libs/serde/serde", version = "1.0.229", features = ["derive"] }
thiserror = { path = "libs/thiserror", version = "2.0.20" }
tokio = { path = "libs/tokio/tokio", version = "1.53.1", default-features = false, features = ["full"] }
tracing = { path = "libs/tracing/tracing", version = "0.1.44" }
tracing-subscriber = { path = "libs/tracing/tracing-subscriber", version = "0.3.23", features = ["env-filter"] }
tui-input = { path = "libs/tui-input", version = "0.15.4", features = ["ratatui-crossterm"] }
tui-markdown = { path = "libs/tui-markdown/tui-markdown", version = "0.3.9", features = ["highlight-code"] }
tui-tree-widget = { path = "libs/tui-rs-tree-widget", version = "0.24.1" }
turso = { path = "libs/turso/bindings/rust", version = "0.7.2", features = ["sync"] }
url = { path = "libs/rust-url/url", version = "2.5.8", features = ["serde"] }
uuid = { path = "libs/uuid", version = "1.24.1", features = ["v4","serde"] }
zenoh = { path = "libs/zenoh/zenoh", version = "1.10.0", default-features = false, features = ["transport_tcp"] }
